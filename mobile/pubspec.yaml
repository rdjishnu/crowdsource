name: nexusgov_mobile
description: NexusGov AI - Citizen Civic Issue Reporting and Map Resolution Mobile App (SIH25031)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  http_parser: ^4.1.2
  path: ^1.9.0
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
