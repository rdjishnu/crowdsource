spring.application.name=nexusgov-backend
server.port=8080

# Database Configuration (MySQL 8.0+)
spring.datasource.url=jdbc:mysql://localhost:3306/nexusgov_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=nexusGovSuperSecretJwtSigningKey2025JharkhandSIHProductionBuild32BytesLong
jwt.expiration=86400000
