spring.application.name=nexusgov-backend
server.port=8080
server.address=0.0.0.0

# Database Configuration (H2 In-Memory DB with MySQL compatibility)
spring.datasource.url=jdbc:h2:mem:nexusgov_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JWT Configuration
jwt.secret=nexusGovSuperSecretJwtSigningKey2025JharkhandSIHProductionBuild32BytesLong
jwt.expiration=86400000
