spring.application.name=nexusgov-backend
server.port=8080

# In-Memory H2 Database Configuration for zero-setup local dev & testing
spring.datasource.url=jdbc:h2:mem:nexusgov_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=nexusGovSuperSecretJwtSigningKey2025JharkhandSIHProductionBuild32BytesLong
jwt.expiration=86400000
