name: citizen_app
description: NexusGov Citizen Portal Flutter Application - A comprehensive portal for citizens to access government services.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.0
  image_picker: ^1.1.0
  shared_preferences: ^2.5.5
  geocoding: ^5.0.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
